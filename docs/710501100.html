<head>

<style>
  :root { --accent:#e23; --brace:#0a8; --group:#d0d; --ink:#1a1a1a; --muted:#888; --line:#e7e7e7; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;
         color:var(--ink); background:#f4f4f5; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header span { color:var(--muted); font-weight:400; }
  .wrap { display:flex; gap:0; height:calc(100vh - 51px); }
  aside { width:230px; flex:none; overflow-y:auto; border-right:1px solid var(--line);
          background:#fff; padding:10px; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em;
             color:var(--muted); margin:14px 6px 6px; }
  .item { display:flex; align-items:center; justify-content:space-between;
          padding:6px 10px; margin:2px 0; border-radius:7px; cursor:pointer;
          border:1px solid transparent; }
  .item:hover, .item.on { background:#fff0f1; border-color:var(--accent); }
  .item .num { font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .item .cnt { font-size:11px; color:var(--muted); background:#f0f0f1;
               border-radius:10px; padding:1px 7px; }
  .item.brace:hover, .item.brace.on { background:#e7faf5; border-color:var(--brace); }
  .item.group:hover, .item.group.on { background:#fbe9fb; border-color:var(--group); }
  main { flex:1; position:relative; overflow:hidden; padding:0;
         background:#f4f4f5; touch-action:none; }
  .stage { position:absolute; top:0; left:0; transform-origin:0 0; cursor:grab;
           box-shadow:0 1px 8px rgba(0,0,0,.12); background:#fff; will-change:transform; }
  .stage.dragging { cursor:grabbing; }
  .stage.animate { transition:transform .35s cubic-bezier(.22,.61,.36,1); }
  .stage img { display:block; user-select:none; -webkit-user-drag:none; }
  .tools { position:absolute; right:14px; bottom:14px; display:flex; gap:4px;
           background:#fff; border:1px solid var(--line); border-radius:9px;
           padding:4px; box-shadow:0 1px 8px rgba(0,0,0,.14); user-select:none; }
  .tools button { width:30px; height:30px; border:0; background:#fff; cursor:pointer;
           border-radius:6px; font:600 15px ui-monospace,monospace; color:var(--ink); }
  .tools button:hover { background:#f0f0f1; }
  .tools button.fit { width:auto; padding:0 10px; font-size:12px; }
  .box { position:absolute; border:2px solid transparent; border-radius:2px;
         pointer-events:auto; transition:background .08s,border-color .08s; }
  .box.callout { border-color:transparent; z-index:1; }
  .box.callout.on { border-color:var(--accent); background:rgba(238,34,51,.18); }
  .box.brace.on   { border-color:var(--brace);  background:rgba(0,168,136,.14); }
  .box.group.on     { border-color:var(--group); background:rgba(221,0,221,.15); }
  .box.groupbrace   { pointer-events:none; border-style:dashed; z-index:0; }
  .box.groupbrace.on { border-color:var(--group); background:rgba(221,0,221,.05); }
  .box.callout.gm   { border-color:var(--group); background:rgba(221,0,221,.18); }
  body.showall .box.callout { border-color:rgba(238,34,51,.35); }
  body.showall .box.brace   { border-color:rgba(0,168,136,.4); }
  body.showall .box.group { border-color:rgba(221,0,221,.45); }
  .tag { position:absolute; top:-9px; left:-2px; transform:translateY(-100%);
         background:var(--accent); color:#fff; font:600 11px ui-monospace,monospace;
         padding:1px 6px; border-radius:6px; white-space:nowrap; display:none; }
  .box.on .tag { display:block; }
  .box.brace .tag { background:var(--brace); }
  .box.group .tag { background:var(--group); }
  .box.gm .tag { display:block; background:var(--group); }
  .box.groupbrace .tag { display:none; }
  .opt { font-size:12px; color:var(--muted); margin:2px 6px 10px; }
  .opt input { vertical-align:-1px; }
</style>
</head>
<body>
<header><h1>710501100.png <span>· 20 callouts · 2 braces · 3 groups</span></h1></header>
<div class="wrap">
  <aside>
    <label class="opt"><input type="checkbox" id="showall"> show all boxes</label>
    <h2>Callout numbers</h2>
    <div id="list"></div>
    <div id="bracelist"></div>
    <div id="grouplist"></div>
  </aside>
  <main id="main">
    <div class="stage" id="stage"><img src="710501100.png" alt="diagram" draggable="false"></div>
    <div class="tools">
      <button id="zout" title="Zoom out">−</button>
      <button id="fit" class="fit" title="Fit to view">Fit</button>
      <button id="zin" title="Zoom in">+</button>
    </div>
  </main>
</div>
<script>
const DATA = {"imgW": 2483, "imgH": 3508, "boxes": [{"id": "d0", "kind": "callout", "text": "10", "x": 13.854208618606526, "y": 41.87571265678449, "w": 2.0539669754329437, "h": 1.1117445838084379, "siblings": ["d0"]}, {"id": "d1", "kind": "callout", "text": "6", "x": 20.98268223922674, "y": 32.04104903078677, "w": 1.0471204188481675, "h": 1.1117445838084379, "siblings": ["d1"]}, {"id": "d2", "kind": "callout", "text": "30", "x": 23.157470801449858, "y": 87.48574686431014, "w": 2.29561014901329, "h": 1.1117445838084379, "siblings": ["d2", "d9", "d16"]}, {"id": "d3", "kind": "callout", "text": "12", "x": 23.60048328634716, "y": 45.03990877993159, "w": 1.973419250906162, "h": 1.0832383124287344, "siblings": ["d3"]}, {"id": "d4", "kind": "callout", "text": "5", "x": 24.40596053161498, "y": 18.07297605473204, "w": 0.9665726943213854, "h": 1.1117445838084379, "siblings": ["d4"]}, {"id": "d5", "kind": "callout", "text": "20", "x": 32.662102295610154, "y": 42.10376282782212, "w": 2.29561014901329, "h": 1.1117445838084379, "siblings": ["d5"]}, {"id": "d6", "kind": "callout", "text": "21", "x": 34.071687474828835, "y": 45.49600912200684, "w": 1.852597664115989, "h": 1.0832383124287344, "siblings": ["d6"]}, {"id": "d7", "kind": "callout", "text": "31", "x": 40.91824405960532, "y": 87.57126567844927, "w": 1.8123238018525976, "h": 1.1117445838084379, "siblings": ["d7"]}, {"id": "d8", "kind": "callout", "text": "13", "x": 43.65686669351591, "y": 51.82440136830102, "w": 1.973419250906162, "h": 1.1117445838084379, "siblings": ["d8"]}, {"id": "d9", "kind": "callout", "text": "30", "x": 46.79822795006041, "y": 52.82212086659065, "w": 2.29561014901329, "h": 1.1117445838084379, "siblings": ["d2", "d9", "d16"]}, {"id": "d10", "kind": "callout", "text": "3", "x": 51.510269834877164, "y": 21.322690992018245, "w": 0.9262988320579945, "h": 1.1117445838084379, "siblings": ["d10"]}, {"id": "d11", "kind": "callout", "text": "4", "x": 54.16834474426098, "y": 22.063854047890537, "w": 1.0873942811115584, "h": 1.1117445838084379, "siblings": ["d11"]}, {"id": "d12", "kind": "callout", "text": "1", "x": 61.09544905356423, "y": 30.273660205245157, "w": 0.40273862263391064, "h": 1.0832383124287344, "siblings": ["d12"]}, {"id": "d13", "kind": "callout", "text": "14", "x": 72.57349979863069, "y": 61.74458380843786, "w": 2.0539669754329437, "h": 1.1117445838084379, "siblings": ["d13"]}, {"id": "d14", "kind": "callout", "text": "22", "x": 73.45952476842528, "y": 58.80843785632839, "w": 2.174788562223117, "h": 1.0832383124287344, "siblings": ["d14"]}, {"id": "d15", "kind": "callout", "text": "15", "x": 76.43979057591623, "y": 62.998859749144806, "w": 1.973419250906162, "h": 1.1117445838084379, "siblings": ["d15"]}, {"id": "d16", "kind": "callout", "text": "30", "x": 79.7422472815143, "y": 64.08209806157355, "w": 2.29561014901329, "h": 1.1117445838084379, "siblings": ["d2", "d9", "d16"]}, {"id": "d17", "kind": "callout", "text": "2", "x": 89.24687877567459, "y": 40.64994298745724, "w": 0.9262988320579945, "h": 1.0832383124287344, "siblings": ["d17"]}, {"id": "d18", "kind": "callout", "text": "11", "x": 19.130084575110754, "y": 43.5290763968073, "w": 1.6512283527990335, "h": 1.0832383124287344, "siblings": ["d18"]}, {"id": "d19", "kind": "callout", "text": "23", "x": 80.54772452678212, "y": 58.09578107183581, "w": 2.174788562223117, "h": 1.1117445838084379, "siblings": ["d19"]}, {"id": "b0", "kind": "brace", "text": "brace", "x": 12.243254128070882, "y": 40.763968072976056, "w": 38.21989528795812, "h": 13.198403648802737, "siblings": ["b0"]}, {"id": "b1", "kind": "brace", "text": "brace", "x": 27.144583165525578, "y": 42.7309007981756, "w": 10.430930326218284, "h": 3.8768529076396807, "siblings": ["b1"]}, {"id": "gb0", "kind": "groupbrace", "text": "grp 5", "x": 21.465968586387437, "y": 25.541619156214367, "w": 4.792589609343536, "h": 0.9122006841505131, "siblings": []}, {"id": "g0", "kind": "group", "text": "grp 5", "x": 24.40596053161498, "y": 18.07297605473204, "w": 0.9665726943213854, "h": 1.1117445838084379, "siblings": ["g0", "gb0"]}, {"id": "gb1", "kind": "groupbrace", "text": "grp 21", "x": 12.243254128070882, "y": 40.763968072976056, "w": 38.21989528795812, "h": 13.198403648802737, "siblings": []}, {"id": "g1", "kind": "group", "text": "grp 21", "x": 34.071687474828835, "y": 45.49600912200684, "w": 1.852597664115989, "h": 1.0832383124287344, "siblings": ["g1", "gb1"]}, {"id": "gb2", "kind": "groupbrace", "text": "grp 20", "x": 27.144583165525578, "y": 42.7309007981756, "w": 10.430930326218284, "h": 3.8768529076396807, "siblings": []}, {"id": "g2", "kind": "group", "text": "grp 20", "x": 32.662102295610154, "y": 42.10376282782212, "w": 2.29561014901329, "h": 1.1117445838084379, "siblings": ["g2", "gb2"]}], "callouts": [{"text": "1", "ids": ["d12"]}, {"text": "2", "ids": ["d17"]}, {"text": "3", "ids": ["d10"]}, {"text": "4", "ids": ["d11"]}, {"text": "5", "ids": ["d4"]}, {"text": "6", "ids": ["d1"]}, {"text": "10", "ids": ["d0"]}, {"text": "11", "ids": ["d18"]}, {"text": "12", "ids": ["d3"]}, {"text": "13", "ids": ["d8"]}, {"text": "14", "ids": ["d13"]}, {"text": "15", "ids": ["d15"]}, {"text": "20", "ids": ["d5"]}, {"text": "21", "ids": ["d6"]}, {"text": "22", "ids": ["d14"]}, {"text": "23", "ids": ["d19"]}, {"text": "30", "ids": ["d2", "d9", "d16"]}, {"text": "31", "ids": ["d7"]}], "braces": ["b0", "b1"], "groups": [{"id": "g0", "brace": "gb0", "label": "5", "members": ["d1"]}, {"id": "g1", "brace": "gb1", "label": "21", "members": ["d0", "d3", "d8", "d9", "d18"]}, {"id": "g2", "brace": "gb2", "label": "20", "members": ["d6"]}]};
const NW = DATA.imgW, NH = DATA.imgH;       // natural image size in px
const main = document.getElementById('main');
const stage = document.getElementById('stage');
const boxEl = {}, boxOf = {}, itemOf = {};  // id -> element, id -> box data, id -> sidebar key
stage.style.width = NW + 'px'; stage.style.height = NH + 'px';

function hi(ids, on) {
  for (const id of ids) {
    if (boxEl[id]) boxEl[id].classList.toggle('on', on);
    const it = document.querySelector('.item[data-key="' + itemOf[id] + '"]');
    if (it) it.classList.toggle('on', on);
  }
}
const GRP = {};                              // group label box id -> group record
for (const g of DATA.groups) GRP[g.id] = g;
function gm(g, on) {                          // members get magenta .gm, not red .on
  for (const id of g.members) if (boxEl[id]) boxEl[id].classList.toggle('gm', on);
}
for (const b of DATA.boxes) {
  const d = document.createElement('div');
  d.className = 'box ' + b.kind;
  d.style.left = b.x + '%'; d.style.top = b.y + '%';
  d.style.width = b.w + '%'; d.style.height = b.h + '%';
  d.innerHTML = '<span class="tag">' + b.text + '</span>';
  stage.appendChild(d);
  boxEl[b.id] = d; boxOf[b.id] = b;
  // siblings = every box sharing this number (so both "7"s light together)
  d.addEventListener('mouseenter', () => hi(b.siblings, true));
  d.addEventListener('mouseleave', () => hi(b.siblings, false));
  if (GRP[b.id]) {
    d.addEventListener('mouseenter', () => gm(GRP[b.id], true));
    d.addEventListener('mouseleave', () => gm(GRP[b.id], false));
  }
}

// --- pan / zoom: a single transform on #stage (boxes ride along) ---
let scale = 1, tx = 0, ty = 0, fitScale = 1;
const MAX = 8;
function apply() { stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
function clampScale(s) { return Math.max(fitScale, Math.min(MAX, s)); }
function fit() {
  const r = main.getBoundingClientRect();
  fitScale = Math.min(r.width / NW, r.height / NH) * 0.96;
  scale = fitScale;
  tx = (r.width - NW * scale) / 2;
  ty = (r.height - NH * scale) / 2;
  apply();
}
// zoom around a focal point given in main-client coords
function zoomTo(s, cx, cy) {
  s = clampScale(s);
  const ix = (cx - tx) / scale, iy = (cy - ty) / scale;  // image point under focus
  scale = s; tx = cx - ix * scale; ty = cy - iy * scale;
  apply();
}
function zoomCenter(factor) {
  const r = main.getBoundingClientRect();
  zoomTo(scale * factor, r.width / 2, r.height / 2);
}
// center a box in the viewport (scroll-to-element); zoom in a bit if very small
function focusBox(id) {
  const b = boxOf[id]; if (!b) return;
  const r = main.getBoundingClientRect();
  const px = (b.x + b.w / 2) / 100 * NW, py = (b.y + b.h / 2) / 100 * NH;
  scale = clampScale(Math.max(scale, fitScale * 2.2));
  tx = r.width / 2 - px * scale; ty = r.height / 2 - py * scale;
  stage.classList.add('animate'); apply();
  setTimeout(() => stage.classList.remove('animate'), 400);
}

main.addEventListener('wheel', e => {
  e.preventDefault();
  const r = main.getBoundingClientRect();
  const factor = Math.exp(-e.deltaY * 0.0015);
  zoomTo(scale * factor, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

let drag = null;
stage.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, tx, ty };
  stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  tx = drag.tx + (e.clientX - drag.x); ty = drag.ty + (e.clientY - drag.y); apply();
});
stage.addEventListener('pointerup', e => {
  drag = null; stage.classList.remove('dragging');
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointercancel', () => {
  drag = null; stage.classList.remove('dragging');
});

document.getElementById('zin').addEventListener('click', () => zoomCenter(1.3));
document.getElementById('zout').addEventListener('click', () => zoomCenter(1 / 1.3));
document.getElementById('fit').addEventListener('click', fit);
let userZoomed = false;
main.addEventListener('wheel', () => userZoomed = true, { passive: true });
stage.addEventListener('pointerdown', () => userZoomed = true);
addEventListener('resize', () => { if (!userZoomed) fit(); });

function makeItem(key, label, ids, kind, cnt) {
  const el = document.createElement('div');
  el.className = 'item ' + kind;
  el.dataset.key = key;
  ids.forEach(id => itemOf[id] = key);
  const n = cnt === undefined ? ids.length : cnt;
  el.innerHTML = '<span class="num">' + label + '</span>' +
                 (n > 1 ? '<span class="cnt">×' + n + '</span>' : '');
  el.addEventListener('mouseenter', () => hi(ids, true));
  el.addEventListener('mouseleave', () => hi(ids, false));
  el.addEventListener('click', () => { userZoomed = true; focusBox(ids[0]); });
  return el;
}
const list = document.getElementById('list');
for (const g of DATA.callouts) list.appendChild(makeItem('c_' + g.text, g.text, g.ids, 'callout'));
const bl = document.getElementById('bracelist');
if (DATA.braces.length) {
  const h = document.createElement('h2'); h.textContent = 'Braces'; bl.appendChild(h);
  DATA.braces.forEach((id, i) => bl.appendChild(makeItem('br_' + id, 'brace ' + (i + 1), [id], 'brace')));
}
const gl = document.getElementById('grouplist');
if (DATA.groups.length) {
  const h = document.createElement('h2'); h.textContent = 'Groups'; gl.appendChild(h);
  for (const g of DATA.groups) {
    // ids[0] is the focus target: the brace for member groups, the label otherwise
    const ids = g.brace ? [g.brace, g.id] : [g.id];
    const el = makeItem('g_' + g.id, 'grp ' + g.label, ids, 'group', g.members.length);
    el.addEventListener('mouseenter', () => gm(g, true));
    el.addEventListener('mouseleave', () => gm(g, false));
    gl.appendChild(el);
  }
}
document.getElementById('showall').addEventListener('change', e =>
  document.body.classList.toggle('showall', e.target.checked));

fit();
</script>
